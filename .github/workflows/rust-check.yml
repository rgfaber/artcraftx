name: "Rust check"

# Compile check, tests and the rustls/ring advisory gate for every branch and PR.
# It publishes nothing and never touches the release workflows.
#
# The five ids in the audit step are the ones macula-io/macula-craft-collab#13
# fixed. The rest of the advisory list is pre-existing on main and is reported,
# not gated, so a red gate always means this package regressed.

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: "cargo check (all targets, offline)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libasound2-dev pkg-config \
            cmake nasm clang libclang-dev

      - name: Cache
        uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8

      # SQLX_OFFLINE=true reads the committed .sqlx cache instead of a live
      # database.
      - name: cargo check
        env:
          SQLX_OFFLINE: 'true'
        run: cargo check --workspace --all-targets

  test:
    name: "cargo test (workspace, offline)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libasound2-dev pkg-config \
            cmake nasm clang libclang-dev

      - name: Cache
        uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8

      # These six crates read fixtures from test_data/, which is in neither this
      # repository nor its upstream, so their tests fail on a clean checkout of
      # main as well. Excluded here, filed separately; every other crate runs.
      - name: cargo test
        env:
          SQLX_OFFLINE: 'true'
        run: |
          cargo test --workspace --no-fail-fast \
            --exclude filesys \
            --exclude file_to_base64_url \
            --exclude images \
            --exclude mimetypes \
            --exclude primitives \
            --exclude test_utils

  audit:
    name: "cargo audit (rustls/ring gate)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Gate on the rustls and ring advisories
        run: |
          cargo audit --json > audit.json || true
          ids=$(jq -r '[.vulnerabilities.list[]?.advisory.id] + [.warnings.list[]?.advisory.id] | .[]' audit.json | sort -u)
          echo "advisories reported for this lock:"; echo "$ids" | sed 's/^/  /'
          status=0
          for id in RUSTSEC-2026-0346 RUSTSEC-2026-0347 RUSTSEC-2026-0348 RUSTSEC-2026-0349 RUSTSEC-2025-0009; do
            if grep -qx "$id" <<< "$ids"; then
              echo "::error::$id is in range for a rustls/ring copy in Cargo.lock"
              status=1
            fi
          done
          exit $status
